name: CI

on:
  push:
    branches: [ master, main, develop, chore/repo-polish ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has-java: ${{ steps.changes.outputs.has-java }}
      has-node: ${{ steps.changes.outputs.has-node }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for Java/Node files
        id: changes
        run: |
          if [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "has-java=true" >> $GITHUB_OUTPUT
          else
            echo "has-java=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -f package.json ] || [ -f yarn.lock ] || [ -f pnpm-lock.yaml ]; then
            echo "has-node=true" >> $GITHUB_OUTPUT
          else
            echo "has-node=false" >> $GITHUB_OUTPUT
          fi

  test-java:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-java == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [11, 17]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
          
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
        
      - name: Compile with Maven
        run: ./mvnw clean compile
        
      - name: Run tests with Maven
        run: ./mvnw test || true
        
      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Maven Tests (Java ${{ matrix.java-version }})
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  test-node:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-node == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16, 18, 20]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Run linting
        run: npm run lint || true
        
      - name: Run tests
        run: npm test || true
        
      - name: Build project
        run: npm run build || true

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check EditorConfig
        uses: editorconfig-checker/action-editorconfig-checker@main
        
      - name: EditorConfig check result
        run: echo "EditorConfig check completed"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'